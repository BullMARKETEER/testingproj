<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Rocket League - Step 5</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    canvas {
      border: 2px solid #94a3b8;
      background: #0b4f2f;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const context = canvas.getContext('2d');

    const gameState = {
      width: canvas.width,
      height: canvas.height,
      keys: {},
      goalHeight: 180,
      score: {
        leftPlayer: 0,
        rightPlayer: 0,
      },
    };

    class Player {
      constructor({ x, y, color, controls }) {
        this.x = x;
        this.y = y;
        this.width = 36;
        this.height = 22;
        this.color = color;
        this.controls = controls;

        this.velocityX = 0;
        this.velocityY = 0;
        this.acceleration = 0.45;
        this.maxSpeed = 5;
        this.friction = 0.9;
      }

      update(keys, bounds) {
        if (keys[this.controls.up]) this.velocityY -= this.acceleration;
        if (keys[this.controls.down]) this.velocityY += this.acceleration;
        if (keys[this.controls.left]) this.velocityX -= this.acceleration;
        if (keys[this.controls.right]) this.velocityX += this.acceleration;

        this.velocityX = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.velocityX));
        this.velocityY = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.velocityY));

        this.x += this.velocityX;
        this.y += this.velocityY;

        this.velocityX *= this.friction;
        this.velocityY *= this.friction;

        if (this.x < 0) {
          this.x = 0;
          this.velocityX = 0;
        }
        if (this.x + this.width > bounds.width) {
          this.x = bounds.width - this.width;
          this.velocityX = 0;
        }
        if (this.y < 0) {
          this.y = 0;
          this.velocityY = 0;
        }
        if (this.y + this.height > bounds.height) {
          this.y = bounds.height - this.height;
          this.velocityY = 0;
        }
      }

      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
    }

    class Ball {
      constructor({ x, y, radius, color }) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;

        this.velocityX = 3.2;
        this.velocityY = 2.1;
        this.friction = 0.996;
        this.minSpeed = 1.2;
      }

      resetToCenter(bounds, launchDirection = 1) {
        this.x = bounds.width / 2;
        this.y = bounds.height / 2;

        const startSpeed = 3.4;
        const randomVertical = (Math.random() * 2 - 1) * 1.4;
        this.velocityX = startSpeed * launchDirection;
        this.velocityY = randomVertical;
      }

      update(bounds) {
        this.x += this.velocityX;
        this.y += this.velocityY;

        const goalTop = (bounds.height - bounds.goalHeight) / 2;
        const goalBottom = goalTop + bounds.goalHeight;
        const insideGoalY = this.y > goalTop && this.y < goalBottom;

        // Bounce off top and bottom walls.
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocityY *= -1;
        }
        if (this.y + this.radius >= bounds.height) {
          this.y = bounds.height - this.radius;
          this.velocityY *= -1;
        }

        // Side wall collision only applies outside the goal opening.
        if (!insideGoalY && this.x - this.radius <= 0) {
          this.x = this.radius;
          this.velocityX *= -1;
        }
        if (!insideGoalY && this.x + this.radius >= bounds.width) {
          this.x = bounds.width - this.radius;
          this.velocityX *= -1;
        }

        this.velocityX *= this.friction;
        this.velocityY *= this.friction;

        const speed = Math.hypot(this.velocityX, this.velocityY);
        if (speed < this.minSpeed) {
          const angle = Math.atan2(this.velocityY, this.velocityX);
          this.velocityX = Math.cos(angle) * this.minSpeed;
          this.velocityY = Math.sin(angle) * this.minSpeed;
        }
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    const players = [
      new Player({
        x: 120,
        y: gameState.height / 2 - 11,
        color: '#60a5fa',
        controls: {
          up: 'KeyW',
          down: 'KeyS',
          left: 'KeyA',
          right: 'KeyD',
        },
      }),
      new Player({
        x: gameState.width - 156,
        y: gameState.height / 2 - 11,
        color: '#f87171',
        controls: {
          up: 'ArrowUp',
          down: 'ArrowDown',
          left: 'ArrowLeft',
          right: 'ArrowRight',
        },
      }),
    ];

    const ball = new Ball({
      x: gameState.width / 2,
      y: gameState.height / 2,
      radius: 12,
      color: '#f8fafc',
    });

    function drawField() {
      context.fillStyle = '#146c43';
      context.fillRect(0, 0, gameState.width, gameState.height);

      context.lineWidth = 4;
      context.strokeStyle = '#e2e8f0';
      context.strokeRect(2, 2, gameState.width - 4, gameState.height - 4);

      const goalTop = (gameState.height - gameState.goalHeight) / 2;
      const goalBottom = goalTop + gameState.goalHeight;

      // Visual goal openings.
      context.strokeStyle = '#f8fafc';
      context.lineWidth = 5;
      context.beginPath();
      context.moveTo(0, goalTop);
      context.lineTo(0, goalBottom);
      context.moveTo(gameState.width, goalTop);
      context.lineTo(gameState.width, goalBottom);
      context.stroke();

      // Step 5 score display.
      context.fillStyle = '#f8fafc';
      context.font = 'bold 28px Arial';
      context.textAlign = 'center';
      context.fillText(`${gameState.score.leftPlayer} : ${gameState.score.rightPlayer}`, gameState.width / 2, 36);
    }

    function resolvePlayerBallCollision(player, ballObject) {
      const closestX = Math.max(player.x, Math.min(ballObject.x, player.x + player.width));
      const closestY = Math.max(player.y, Math.min(ballObject.y, player.y + player.height));

      const deltaX = ballObject.x - closestX;
      const deltaY = ballObject.y - closestY;
      const distanceSquared = deltaX * deltaX + deltaY * deltaY;

      if (distanceSquared > ballObject.radius * ballObject.radius) {
        return;
      }

      const distance = Math.sqrt(distanceSquared) || 0.0001;
      let normalX = deltaX / distance;
      let normalY = deltaY / distance;

      if (!Number.isFinite(normalX) || !Number.isFinite(normalY)) {
        normalX = 1;
        normalY = 0;
      }

      const overlap = ballObject.radius - distance;
      ballObject.x += normalX * overlap;
      ballObject.y += normalY * overlap;

      const relativeVelocityX = ballObject.velocityX - player.velocityX;
      const relativeVelocityY = ballObject.velocityY - player.velocityY;
      const velocityAlongNormal = relativeVelocityX * normalX + relativeVelocityY * normalY;

      if (velocityAlongNormal < 0) {
        const restitution = 1.08;
        const baseImpulse = -(1 + restitution) * velocityAlongNormal;
        const randomFactor = 1 + (Math.random() * 0.16 - 0.08);
        const impulse = baseImpulse * randomFactor;

        ballObject.velocityX += normalX * impulse + (Math.random() - 0.5) * 0.18;
        ballObject.velocityY += normalY * impulse + (Math.random() - 0.5) * 0.18;
      }
    }

    function handleGoalIfScored() {
      const goalTop = (gameState.height - gameState.goalHeight) / 2;
      const goalBottom = goalTop + gameState.goalHeight;
      const insideGoalY = ball.y > goalTop && ball.y < goalBottom;

      if (!insideGoalY) {
        return;
      }

      if (ball.x + ball.radius < 0) {
        gameState.score.rightPlayer += 1;
        ball.resetToCenter(gameState, -1);
      } else if (ball.x - ball.radius > gameState.width) {
        gameState.score.leftPlayer += 1;
        ball.resetToCenter(gameState, 1);
      }
    }

    function update() {
      for (const player of players) {
        player.update(gameState.keys, gameState);
      }

      ball.update(gameState);

      for (const player of players) {
        resolvePlayerBallCollision(player, ball);
      }

      handleGoalIfScored();
    }

    function render() {
      drawField();

      for (const player of players) {
        player.draw(context);
      }

      ball.draw(context);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (event) => {
      gameState.keys[event.code] = true;
    });

    window.addEventListener('keyup', (event) => {
      gameState.keys[event.code] = false;
    });

    gameLoop();
  </script>
</body>
</html>
